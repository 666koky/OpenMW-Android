name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Build OpenMW APK
        working-directory: source
        run: bash ./gradlew assembleMainlineDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Android-debug
          path: source/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
